# =============================================================================
# Docker Compose for Django Velocity - Production
# =============================================================================
# Usage: docker compose -f docker-compose.production.yml up -d
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/production/django/Dockerfile
    volumes:
      - django-static:/app/staticfiles
      - django-media:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.production
      # Disable SSL redirect for local production testing via Nginx HTTP
      - SECURE_SSL_REDIRECT=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: dockerfiles/production/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - django-static:/app/staticfiles
      - django-media:/app/media
      # - certbot-etc:/etc/letsencrypt # Uncomment if using Certbot locally
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: dockerfiles/production/postgres/Dockerfile
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup-data:/backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velocity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_MAX_AGE_DAYS: ${BACKUP_MAX_AGE_DAYS:-30}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-50}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: dockerfiles/production/django/Dockerfile
    command: /start-celeryworker
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: dockerfiles/production/django/Dockerfile
    command: /start-celerybeat
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backup-data:
  django-static:
  django-media:
