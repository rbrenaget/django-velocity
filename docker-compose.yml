services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/local/django/Dockerfile
    command: /start
    ports:
      - "8000:8000"
      - "5678:5678" # debugpy remote debugging port
    volumes:
      - .:/app
      - python-packages:/usr/local/lib/python3.14/site-packages
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: dockerfiles/production/postgres/Dockerfile
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup-data:/backups
    environment:
      POSTGRES_DB: velocity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d velocity" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: dockerfiles/local/django/Dockerfile
    command: /start-celeryworker
    volumes:
      - .:/app
      - python-packages:/usr/local/lib/python3.14/site-packages
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: dockerfiles/local/django/Dockerfile
    command: /start-celerybeat
    volumes:
      - .:/app
      - python-packages:/usr/local/lib/python3.14/site-packages
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  python-packages:
  backup-data:
