# =============================================================================
# Nginx Configuration for Django Velocity
# =============================================================================

upstream django {
    # Nginx and Django will communicate over TCP within the Docker network.
    # This is the industry standard for Docker multi-container setups.
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost; # REPLACE WITH YOUR DOMAIN OR UNDERSCORE "_" FOR ALL

    # Security Headers (Industry standard)
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off; # Hides Nginx version

    # Maximum upload size for media/files (adjust if you need larger uploads)
    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # Static and Media Files
    # -------------------------------------------------------------------------
    # If the files exist in the mounted volumes, Nginx serves them instantly (best performance).
    # If they are not found locally (or you use S3 + WhiteNoise), it falls back to proxying to Django.

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @proxy_to_app;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @proxy_to_app;
    }

    # -------------------------------------------------------------------------
    # Application Proxy
    # -------------------------------------------------------------------------
    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://django;

        # Support for WebSockets (Django Channels / Daphne)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass standard proxy headers to Django
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If Nginx handles HTTPS (see block below), you MUST uncomment the next line:
        # proxy_set_header X-Forwarded-Proto https;

        proxy_redirect off;

        # Timeouts - increase if you have long-running connections or slow queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

